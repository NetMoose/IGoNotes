version: "1"
name: Release
on:
  push:
    branches:
      - master
jobs:
  release:
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Setup Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.21'

      - name: Build
        run: go build -o igonotes cmd/api/main.go

      - name: Release
        uses: go-gitea/act-gitea-release@main
        with:
          files: igonotes
          generate_release_notes: true
