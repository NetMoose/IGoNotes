<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>IGoNotes — Редактор заметок</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <div class="container">
        <h1>IGoNotes</h1>
        <div class="sidebar">
            <h3>Заметки</h3>
            <ul id="notesTree"></ul>
        </div>
        <div class="editor-area">
            <div class="toolbar">
                <button id="previewBtn">Просмотр</button>
            </div>
            <textarea id="editor"></textarea>
            <div id="preview" class="preview"></div>
        </div>
    </div>
    <script src="/static/js/markdown.js"></script>
    <script src="/static/js/app.js"></script>
</body>
</html>
