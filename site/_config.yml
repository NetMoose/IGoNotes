title: IGoNotes
email: contact@igonotes.dev
description: >-
  Редактор заметок на Go
baseurl: /igonotes
url: "https://netmoose.gitverse.site"
twitter_username: igonotes_dev
github_username: igonotes

# Тема
# Используем встроенную минималистичную тему без необходимости в sass
theme: minima

# Посты
collections:
  docs:
    output: true
    permalink: /:collection/:path/

# Сборка
markdown: kramdown

exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
  - go.mod
  - go.sum
  - cmd/
  - internal/
  - web/
  - .github/