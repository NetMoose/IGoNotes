name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      IGONOTES_REQUIRE_GIT_INTEGRATION: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install frontend dependencies
        working-directory: web
        run: npm ci

      - name: Audit frontend dependencies
        working-directory: web
        run: npm audit --audit-level=high

      - name: Verify frontend and build embedded assets
        working-directory: web
        run: npm run verify

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Native Git version
        run: git --version

      - name: Full Go suite with mandatory native Git
        run: go test ./... -count=1 -timeout=20m

      - name: Race detector
        run: go test -race ./... -count=1 -timeout=20m

      - name: Vet
        run: go vet ./...

      - name: Build release archives
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          mkdir -p release build

          build_tar() {
            local goos="$1"
            local goarch="$2"
            local output="build/${goos}-${goarch}/igonotes"
            mkdir -p "$(dirname "$output")"
            CGO_ENABLED=0 GOOS="$goos" GOARCH="$goarch" \
              go build -trimpath -ldflags="-s -w" -o "$output" ./cmd/api
            tar -C "$(dirname "$output")" -czf \
              "release/igonotes-${VERSION}-${goos}-${goarch}.tar.gz" igonotes
          }

          build_zip() {
            local goos="$1"
            local goarch="$2"
            local output="build/${goos}-${goarch}/igonotes.exe"
            mkdir -p "$(dirname "$output")"
            CGO_ENABLED=0 GOOS="$goos" GOARCH="$goarch" \
              go build -trimpath -ldflags="-s -w" -o "$output" ./cmd/api
            zip -j "release/igonotes-${VERSION}-${goos}-${goarch}.zip" "$output"
          }

          build_tar linux amd64
          build_tar linux arm64
          build_zip windows amd64
          build_zip windows arm64
          build_tar darwin amd64
          build_tar darwin arm64

          cd release
          sha256sum ./*.tar.gz ./*.zip > checksums.txt

      - name: Upload verified release archives
        uses: actions/upload-artifact@v6
        with:
          name: release-archives
          path: release/*
          retention-days: 1
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download verified release archives
        uses: actions/download-artifact@v7
        with:
          name: release-archives
          path: release

      - name: Verify checksums and publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PRERELEASE: ${{ contains(github.ref_name, '-') }}
        run: |
          set -euo pipefail
          cd release
          archives=(./*.tar.gz ./*.zip)
          [[ "${#archives[@]}" -eq 6 ]]
          [[ "$(wc -l < checksums.txt)" -eq 6 ]]
          # Verify the exact six expected archives, including their names.
          sha256sum "${archives[@]}" > expected-checksums.txt
          cmp checksums.txt expected-checksums.txt
          sha256sum --check checksums.txt

          prerelease_args=()
          if [[ "$PRERELEASE" == "true" ]]; then
            prerelease_args+=(--prerelease)
          fi

          gh release create "${GITHUB_REF_NAME}" \
            "${archives[@]}" \
            checksums.txt \
            --verify-tag \
            --generate-notes \
            --title "${GITHUB_REF_NAME}" \
            "${prerelease_args[@]}"
