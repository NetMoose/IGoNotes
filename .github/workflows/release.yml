name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install frontend dependencies
        working-directory: web
        run: npm ci

      - name: Audit frontend dependencies
        working-directory: web
        run: npm audit --audit-level=high

      - name: Build frontend
        working-directory: web
        run: npm run build

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Test
        run: go test ./...

      - name: Build release archives
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          mkdir -p release build

          build_tar() {
            local goos="$1"
            local goarch="$2"
            local output="build/${goos}-${goarch}/igonotes"
            mkdir -p "$(dirname "$output")"
            CGO_ENABLED=0 GOOS="$goos" GOARCH="$goarch" \
              go build -trimpath -ldflags="-s -w" -o "$output" ./cmd/api
            tar -C "$(dirname "$output")" -czf \
              "release/igonotes-${VERSION}-${goos}-${goarch}.tar.gz" igonotes
          }

          build_zip() {
            local goos="$1"
            local goarch="$2"
            local output="build/${goos}-${goarch}/igonotes.exe"
            mkdir -p "$(dirname "$output")"
            CGO_ENABLED=0 GOOS="$goos" GOARCH="$goarch" \
              go build -trimpath -ldflags="-s -w" -o "$output" ./cmd/api
            zip -j "release/igonotes-${VERSION}-${goos}-${goarch}.zip" "$output"
          }

          build_tar linux amd64
          build_tar linux arm64
          build_zip windows amd64
          build_zip windows arm64
          build_tar darwin amd64
          build_tar darwin arm64

          cd release
          sha256sum ./*.tar.gz ./*.zip > checksums.txt

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ contains(github.ref_name, '-') }}
        run: |
          set -euo pipefail
          prerelease_args=()
          if [[ "$PRERELEASE" == "true" ]]; then
            prerelease_args+=(--prerelease)
          fi

          gh release create "${GITHUB_REF_NAME}" \
            release/*.tar.gz \
            release/*.zip \
            release/checksums.txt \
            --verify-tag \
            --generate-notes \
            --title "${GITHUB_REF_NAME}" \
            "${prerelease_args[@]}"
