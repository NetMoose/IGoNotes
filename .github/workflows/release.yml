name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      IGONOTES_REQUIRE_GIT_INTEGRATION: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install frontend dependencies
        working-directory: web
        run: npm ci

      - name: Audit frontend dependencies
        working-directory: web
        run: npm audit --audit-level=high

      - name: Verify frontend and build embedded assets
        working-directory: web
        run: npm run verify

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Prepare Go modules for offline browser fixtures
        run: go mod download
      - name: Install extension dependencies
        run: npm --prefix extensions/webclipper ci
      - name: Audit extension dependencies
        run: npm --prefix extensions/webclipper audit --audit-level=high
      - name: Verify extension and build standalone dist
        run: npm --prefix extensions/webclipper run verify
      - name: Install CI Chromium and system dependencies
        run: node extensions/webclipper/node_modules/playwright-core/cli.js install --with-deps chromium
      - name: Package and test the extracted extension
        shell: bash
        env:
          # Disposable CI runner: headed acceptance with sandbox is recorded separately.
          CLIPPER_SMOKE_NO_SANDBOX: '1'
        run: |
          set -euo pipefail
          python3 extensions/webclipper/scripts/package.py "$RUNNER_TEMP/webclipper.zip"
          mkdir "$RUNNER_TEMP/webclipper-unpacked"
          python3 -m zipfile -e "$RUNNER_TEMP/webclipper.zip" "$RUNNER_TEMP/webclipper-unpacked"
          export CLIPPER_SMOKE_EXTENSION_PATH="$RUNNER_TEMP/webclipper-unpacked"
          export CHROMIUM_PATH="$(node -e "process.stdout.write(require('./extensions/webclipper/node_modules/playwright-core').chromium.executablePath())")"
          npm --prefix extensions/webclipper run test:browser

      - name: Native Git version
        run: git --version

      - name: Full Go suite with mandatory native Git
        run: go test ./... -count=1 -timeout=20m

      - name: Race detector
        run: go test -race ./... -count=1 -timeout=20m

      - name: Vet
        run: go vet ./...

      - name: Build release archives
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          mkdir -p release build

          build_tar() {
            local goos="$1"
            local goarch="$2"
            local output="build/${goos}-${goarch}/igonotes"
            mkdir -p "$(dirname "$output")"
            CGO_ENABLED=0 GOOS="$goos" GOARCH="$goarch" \
              go build -trimpath -ldflags="-s -w -X IGoNotes/internal/appinfo.Version=${VERSION}" -o "$output" ./cmd/api
            tar -C "$(dirname "$output")" -czf \
              "release/igonotes-${VERSION}-${goos}-${goarch}.tar.gz" igonotes
          }

          build_zip() {
            local goos="$1"
            local goarch="$2"
            local output="build/${goos}-${goarch}/igonotes.exe"
            mkdir -p "$(dirname "$output")"
            CGO_ENABLED=0 GOOS="$goos" GOARCH="$goarch" \
              go build -trimpath -ldflags="-s -w -X IGoNotes/internal/appinfo.Version=${VERSION}" -o "$output" ./cmd/api
            zip -j "release/igonotes-${VERSION}-${goos}-${goarch}.zip" "$output"
          }

          build_tar linux amd64
          build_tar linux arm64
          build_zip windows amd64
          build_zip windows arm64
          build_tar darwin amd64
          build_tar darwin arm64

          python3 extensions/webclipper/scripts/package.py "release/igonotes-webclipper-${VERSION}.zip"

          cd release
          sha256sum ./*.tar.gz ./*.zip > checksums.txt

      - name: Upload verified release archives
        uses: actions/upload-artifact@v6
        with:
          name: release-archives
          path: release/*
          retention-days: 1
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download verified release archives
        uses: actions/download-artifact@v7
        with:
          name: release-archives
          path: release

      - name: Verify checksums and publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PRERELEASE: ${{ contains(github.ref_name, '-') }}
        run: |
          set -euo pipefail
          cd release
          archives=(./*.tar.gz ./*.zip)
          [[ "${#archives[@]}" -eq 7 ]]
          [[ "$(wc -l < checksums.txt)" -eq 7 ]]
          # Verify the six binaries and the separately tested extension archive.
          expected=(
            "./igonotes-${GITHUB_REF_NAME}-darwin-amd64.tar.gz"
            "./igonotes-${GITHUB_REF_NAME}-darwin-arm64.tar.gz"
            "./igonotes-${GITHUB_REF_NAME}-linux-amd64.tar.gz"
            "./igonotes-${GITHUB_REF_NAME}-linux-arm64.tar.gz"
            "./igonotes-${GITHUB_REF_NAME}-windows-amd64.zip"
            "./igonotes-${GITHUB_REF_NAME}-windows-arm64.zip"
            "./igonotes-webclipper-${GITHUB_REF_NAME}.zip"
          )
          for archive in "${expected[@]}"; do [[ -f "$archive" ]]; done
          sha256sum "${archives[@]}" > expected-checksums.txt
          cmp checksums.txt expected-checksums.txt
          sha256sum --check checksums.txt

          prerelease_args=()
          if [[ "$PRERELEASE" == "true" ]]; then
            prerelease_args+=(--prerelease)
          fi

          gh release create "${GITHUB_REF_NAME}" \
            "${archives[@]}" \
            checksums.txt \
            --verify-tag \
            --generate-notes \
            --title "${GITHUB_REF_NAME}" \
            "${prerelease_args[@]}"
